apply plugin: 'com.android.application'
apply plugin: 'android.aop'
android {
    // 编译源码版本
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        // 无痛修改包名： https://www.jianshu.com/p/17327e191d2e
        applicationId "com.linewell.lxhdemo"
        // 最低安装版本
        minSdkVersion rootProject.ext.minSdkVersion
        // 目标适配版本
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        manifestPlaceholders = [
                qqappid: "12345678" // 替换为你的真实QQ应用ID（从QQ开放平台获取）
        ]
        ndk {
            // 设置支持的SO库架构
            //abiFilters 'armeabi' //, 'x86', 'armeabi-v7a', 'x86_64', 'arm64-v8a'
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    signingConfigs {
        config {
            storeFile file('fjwl.jks')       // 密钥库文件（.jks/.keystore）
            storePassword "StorePassword"     // 密钥库密码
            keyAlias "KeyAlias"               // 密钥别名
            keyPassword "KeyPassword"         // 密钥密码
        }
    }
    buildTypes {
        release {
            // 调试模式开关
            debuggable false
            jniDebuggable false
            // 代码混淆开关
            minifyEnabled false
            // 混淆配置文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 签名信息配置
            signingConfig signingConfigs.config
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs', 'src/main/jniLibs']
        }
    }
    repositories {

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        //是否生成 BuildConfig 类 若需要保留 BuildConfig（99% 的项目需要，比如用到 BuildConfig.DEBUG）：
        buildConfig = true
    }
    namespace 'com.linewell.lxhdemo'
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$rootProject.androidxVersion"
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.6.0'
    implementation 'androidx.navigation:navigation-ui:2.6.0'
    testImplementation 'junit:junit:4.13.2'
    // Dex分包，解决 65k 问题
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation project(':mylibrary')
    implementation 'org.greenrobot:eventbus:3.3.1'
    annotationProcessor 'org.greenrobot:eventbus-annotation-processor:3.3.1'
    //异常上报Bugly https://bugly.qq.com/docs/user-guide/instruction-manual-android/?v=1.0.0#_3
    implementation 'com.tencent.bugly:crashreport:latest.release'
    //AOP 插件库：https://github.com/FlyJingFish/AndroidAOP/blob/master/README-zh.md
    implementation 'io.github.flyjingfish:androidaop-core:2.7.4'
    annotationProcessor 'io.github.flyjingfish:androidaop-apt:2.7.4'
}



